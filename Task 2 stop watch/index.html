<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #69CFAF;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            background-color:#EFEAEA;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .title {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        #stopWatch {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #EFEAEA;
            border: #69CFAF 2px solid;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #69CFAF;
            color: white;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 1.5rem;
            }
            #stopWatch {
                font-size: 2rem;
            }
            button {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
        @media (max-width: 400px) {
            .title {
                font-size: 1.2rem;
            }
            #stopWatch {
                font-size: 1.5rem;
            }
            button {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

    </style>
</head>
<body>
     <div class="container">
        <h1 class="title">Stopwatch🕑</h1>
         <div id="stopWatch">
        00:00:00
    </div>
    <div class="buttons">
     <button onclick="start()">Start▶️</button>
      <button onclick="stopbtn()">Stop⏹️</button>
      <button onclick="reset()">Reset🔄</button>
    </div>
     </div>
  <h3 class="title">Made by Warisha 🚀</h3>

    <script src="script.js"></script>
</body>
</html>
